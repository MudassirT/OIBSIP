<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskForge — Modern & Interactive To-Do Web App</title>
  <meta name="description" content="TaskForge: A sleek, accessible, modern to-do list web application with inline editing, timestamps, live counters, and localStorage persistence.">
  
  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient-glow ambient-glow-top" aria-hidden="true"></div>
  <div class="ambient-glow ambient-glow-bottom" aria-hidden="true"></div>

  <div class="app-wrapper">
    <!-- Header -->
    <header class="app-header">
      <div class="brand-row">
        <div class="brand-icon-wrapper" aria-hidden="true">
          <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="brand-title">TaskForge</h1>
          <p class="brand-tagline">Forge focus, conquer your day.</p>
        </div>
      </div>

      <!-- Quick Progress Bar -->
      <div class="progress-container" aria-label="Task completion progress">
        <div class="progress-info">
          <span class="progress-label" id="progress-label">Productivity Status</span>
          <span class="progress-percent" id="progress-percent">0%</span>
        </div>
        <div class="progress-track" role="progressbar" id="progress-bar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-labelledby="progress-label">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
    </header>

    <!-- Main Content Card -->
    <main class="app-card">
      <!-- Input Creation Section -->
      <section class="create-task-section" aria-label="Create new task">
        <form id="task-form" class="task-form" novalidate>
          <div class="input-group">
            <label for="task-input" class="visually-hidden">Task description</label>
            <div class="input-wrapper">
              <span class="input-prefix-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
              </span>
              <input
                type="text"
                id="task-input"
                class="task-input"
                placeholder="What needs to be done? (e.g. Design homepage hero)"
                maxlength="100"
                autocomplete="off"
                spellcheck="true"
                aria-describedby="input-error char-counter"
                required
              >
              <span id="char-counter" class="char-counter" aria-hidden="true">0/100</span>
            </div>
            <button type="submit" id="add-task-btn" class="btn btn-primary" aria-label="Add Task">
              <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span>Add Task</span>
            </button>
          </div>
          <!-- Friendly inline error banner -->
          <div id="input-error" class="input-error" role="alert" aria-live="polite"></div>
        </form>
      </section>

      <!-- Pending Tasks Section -->
      <section class="tasks-section" aria-labelledby="pending-heading">
        <div class="section-header">
          <div class="section-title-wrap">
            <svg class="section-icon pending-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
            <h2 id="pending-heading" class="section-title">Pending Tasks</h2>
          </div>
          <span id="pending-count" class="badge badge-pending" aria-live="polite">0 pending</span>
        </div>

        <ul id="pending-list" class="task-list" role="list">
          <!-- Pending tasks rendered dynamically via script.js -->
        </ul>
      </section>

      <!-- Completed Tasks Section -->
      <section class="tasks-section" aria-labelledby="completed-heading">
        <div class="section-header">
          <div class="section-title-wrap">
            <svg class="section-icon completed-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <h2 id="completed-heading" class="section-title">Completed Tasks</h2>
          </div>
          <div class="section-actions">
            <span id="completed-count" class="badge badge-completed" aria-live="polite">0 completed</span>
            <button
              type="button"
              id="clear-completed-btn"
              class="btn btn-ghost btn-sm"
              aria-label="Clear all completed tasks"
              hidden
            >
              <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
              <span>Clear completed</span>
            </button>
          </div>
        </div>

        <ul id="completed-list" class="task-list" role="list">
          <!-- Completed tasks rendered dynamically via script.js -->
        </ul>
      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p class="footer-meta">
        <strong>TaskForge</strong> &bull; Oasis Infobyte Web Development Internship (Level 2, Task 3)
      </p>
      <p class="footer-author">
        Developed with pure Vanilla Web Technologies by <span>Mudassir Ahmed</span>
      </p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>

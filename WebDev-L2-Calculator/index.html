<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CalcPro - Modern Precision Calculator</title>
  <meta name="description" content="CalcPro is a modern, high-precision web calculator built with vanilla HTML, CSS Grid, and JavaScript featuring operator precedence, keyboard support, and division-by-zero protection.">
  
  <!-- Google Fonts: Plus Jakarta Sans for UI, JetBrains Mono for Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-container">
    <div class="calculator-card" role="application" aria-label="CalcPro Calculator">
      
      <!-- Calculator Header / Brand -->
      <header class="calculator-header">
        <div class="brand-group">
          <div class="brand-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="2" width="16" height="20" rx="3" ry="3"></rect>
              <line x1="8" y1="6" x2="16" y2="6"></line>
              <line x1="16" y1="14" x2="16" y2="14.01"></line>
              <line x1="8" y1="14" x2="8" y2="14.01"></line>
              <line x1="12" y1="14" x2="12" y2="14.01"></line>
              <line x1="16" y1="18" x2="16" y2="18.01"></line>
              <line x1="8" y1="18" x2="8" y2="18.01"></line>
              <line x1="12" y1="18" x2="12" y2="18.01"></line>
            </svg>
          </div>
          <span class="brand-name">Calc<span class="brand-highlight">Pro</span></span>
        </div>
        <div class="internship-badge" title="Oasis Infobyte Web Development Internship - Level 2 Task 1">
          OIBSIP • L2T1
        </div>
      </header>

      <!-- Calculator Dual-Line Display Screen -->
      <section class="calculator-display" role="region" aria-label="Calculator screen">
        <div 
          class="display-secondary" 
          id="display-secondary" 
          aria-label="Calculation expression"
          title="Full expression"
        ></div>
        <div 
          class="display-primary" 
          id="display-primary" 
          role="status" 
          aria-live="polite" 
          aria-atomic="true"
          title="Current input or result"
        >0</div>
      </section>

      <!-- Calculator Keypad (4-column CSS Grid) -->
      <div class="calculator-keypad" id="calculator-keypad" role="group" aria-label="Calculator keypad">
        <!-- Row 1: Clear, Backspace, Plus/Minus, Divide -->
        <button type="button" class="calc-btn btn-clear" data-action="clear" aria-label="Clear all" id="btn-clear">
          <span class="btn-text">C</span>
        </button>

        <button type="button" class="calc-btn btn-backspace" data-action="backspace" aria-label="Backspace delete" id="btn-backspace">
          <span class="btn-text" aria-hidden="true">⌫</span>
        </button>

        <button type="button" class="calc-btn btn-function" data-action="negate" aria-label="Toggle sign plus minus" id="btn-negate">
          <span class="btn-text" aria-hidden="true">±</span>
        </button>

        <button type="button" class="calc-btn btn-operator" data-action="operator" data-value="/" aria-label="Divide" id="btn-divide">
          <span class="btn-text" aria-hidden="true">÷</span>
        </button>

        <!-- Row 2: 7, 8, 9, Multiply -->
        <button type="button" class="calc-btn btn-number" data-action="number" data-value="7" aria-label="Number 7" id="btn-7">
          <span class="btn-text">7</span>
        </button>

        <button type="button" class="calc-btn btn-number" data-action="number" data-value="8" aria-label="Number 8" id="btn-8">
          <span class="btn-text">8</span>
        </button>

        <button type="button" class="calc-btn btn-number" data-action="number" data-value="9" aria-label="Number 9" id="btn-9">
          <span class="btn-text">9</span>
        </button>

        <button type="button" class="calc-btn btn-operator" data-action="operator" data-value="*" aria-label="Multiply" id="btn-multiply">
          <span class="btn-text" aria-hidden="true">×</span>
        </button>

        <!-- Row 3: 4, 5, 6, Subtract -->
        <button type="button" class="calc-btn btn-number" data-action="number" data-value="4" aria-label="Number 4" id="btn-4">
          <span class="btn-text">4</span>
        </button>

        <button type="button" class="calc-btn btn-number" data-action="number" data-value="5" aria-label="Number 5" id="btn-5">
          <span class="btn-text">5</span>
        </button>

        <button type="button" class="calc-btn btn-number" data-action="number" data-value="6" aria-label="Number 6" id="btn-6">
          <span class="btn-text">6</span>
        </button>

        <button type="button" class="calc-btn btn-operator" data-action="operator" data-value="-" aria-label="Subtract" id="btn-subtract">
          <span class="btn-text" aria-hidden="true">−</span>
        </button>

        <!-- Row 4: 1, 2, 3, Add -->
        <button type="button" class="calc-btn btn-number" data-action="number" data-value="1" aria-label="Number 1" id="btn-1">
          <span class="btn-text">1</span>
        </button>

        <button type="button" class="calc-btn btn-number" data-action="number" data-value="2" aria-label="Number 2" id="btn-2">
          <span class="btn-text">2</span>
        </button>

        <button type="button" class="calc-btn btn-number" data-action="number" data-value="3" aria-label="Number 3" id="btn-3">
          <span class="btn-text">3</span>
        </button>

        <button type="button" class="calc-btn btn-operator" data-action="operator" data-value="+" aria-label="Add" id="btn-add">
          <span class="btn-text" aria-hidden="true">+</span>
        </button>

        <!-- Row 5: 0 (span 2), Decimal, Equals -->
        <button type="button" class="calc-btn btn-number btn-zero" data-action="number" data-value="0" aria-label="Number 0" id="btn-0">
          <span class="btn-text">0</span>
        </button>

        <button type="button" class="calc-btn btn-number" data-action="decimal" aria-label="Decimal point" id="btn-decimal">
          <span class="btn-text">.</span>
        </button>

        <button type="button" class="calc-btn btn-equals" data-action="equals" aria-label="Calculate equals" id="btn-equals">
          <span class="btn-text" aria-hidden="true">=</span>
        </button>
      </div>

      <!-- Quick Keyboard Helper Footer -->
      <footer class="calculator-footer">
        <span class="shortcut-tip">Keyboard shortcuts enabled</span>
        <div class="shortcut-tags">
          <kbd>0-9</kbd>
          <kbd>+ - * /</kbd>
          <kbd>Enter =</kbd>
          <kbd>Esc C</kbd>
          <kbd>⌫ Del</kbd>
        </div>
      </footer>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>

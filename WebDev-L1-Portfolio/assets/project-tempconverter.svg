<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="tcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="tcWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="tcCool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="tcCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#131d2e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#tcBg)"/>

  <!-- Thermometer Instrument Visual (Left) -->
  <g transform="translate(60, 45)">
    <!-- Ambient glow circle -->
    <circle cx="50" cy="200" r="45" fill="url(#tcWarm)" opacity="0.15" filter="blur(8px)"/>
    
    <!-- Outer glass tube -->
    <rect x="36" y="20" width="28" height="190" rx="14" fill="#141e33" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    <circle cx="50" cy="216" r="32" fill="#141e33" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

    <!-- Mercury / Liquid fill -->
    <rect x="42" y="90" width="16" height="120" rx="8" fill="url(#tcWarm)"/>
    <circle cx="50" cy="216" r="24" fill="url(#tcWarm)"/>

    <!-- Tick marks -->
    <line x1="70" y1="40" x2="82" y2="40" stroke="#64748b" stroke-width="2"/>
    <line x1="70" y1="70" x2="88" y2="70" stroke="#64748b" stroke-width="2"/>
    <line x1="70" y1="100" x2="82" y2="100" stroke="#64748b" stroke-width="2"/>
    <line x1="70" y1="130" x2="88" y2="130" stroke="#64748b" stroke-width="2"/>
    <line x1="70" y1="160" x2="82" y2="160" stroke="#64748b" stroke-width="2"/>

    <text x="96" y="74" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">100°C</text>
    <text x="96" y="134" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">37°C</text>
    <text x="96" y="194" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">0°C</text>
  </g>

  <!-- Interactive Conversion Panels (Right) -->
  <g transform="translate(230, 45)">
    <!-- Main Conversion Card -->
    <rect x="0" y="0" width="320" height="270" rx="14" fill="url(#tcCard)" stroke="rgba(255,255,255,0.08)"/>
    
    <!-- Header -->
    <text x="24" y="34" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1">UNIT CONVERSION ENGINE</text>
    <rect x="245" y="20" width="55" height="18" rx="9" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="254" y="33" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="bold">ONLINE</text>

    <!-- Value Row 1: Celsius -->
    <rect x="24" y="52" width="272" height="54" rx="10" fill="#0f172a" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5"/>
    <text x="40" y="85" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold">37.0</text>
    <rect x="230" y="65" width="50" height="28" rx="6" fill="#1e293b"/>
    <text x="245" y="84" fill="#00f2fe" font-family="sans-serif" font-size="14" font-weight="bold">°C</text>

    <!-- Value Row 2: Fahrenheit -->
    <rect x="24" y="120" width="272" height="54" rx="10" fill="#0f172a" stroke="rgba(249, 115, 22, 0.3)" stroke-width="1.5"/>
    <text x="40" y="153" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold">98.6</text>
    <rect x="230" y="133" width="50" height="28" rx="6" fill="#1e293b"/>
    <text x="245" y="152" fill="#f97316" font-family="sans-serif" font-size="14" font-weight="bold">°F</text>

    <!-- Value Row 3: Kelvin -->
    <rect x="24" y="188" width="272" height="54" rx="10" fill="#0f172a" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1.5"/>
    <text x="40" y="221" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold">310.15</text>
    <rect x="230" y="201" width="50" height="28" rx="6" fill="#1e293b"/>
    <text x="250" y="220" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="bold">K</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="nfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="nfAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="nfPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="nfCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#141e33"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="360" rx="16" fill="url(#nfBg)"/>

  <!-- Subtle grid lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
  </g>

  <!-- Window Header -->
  <rect x="0" y="0" width="600" height="42" fill="#17223b" rx="16"/>
  <rect x="0" y="30" width="600" height="12" fill="#17223b"/>
  <!-- Window Controls -->
  <circle cx="28" cy="21" r="5" fill="#ef4444"/>
  <circle cx="46" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="64" cy="21" r="5" fill="#10b981"/>
  <rect x="92" y="12" width="220" height="18" rx="9" fill="#0f172a"/>
  <text x="110" y="25" fill="#64748b" font-family="sans-serif" font-size="10">https://novaflow.io/landing</text>

  <!-- Hero Content Preview -->
  <!-- Floating Card 1: Metric -->
  <rect x="36" y="64" width="240" height="110" rx="12" fill="url(#nfCard)" stroke="rgba(255,255,255,0.08)"/>
  <text x="56" y="94" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">CONVERSION VELOCITY</text>
  <text x="56" y="132" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="bold">+148.6%</text>
  <path d="M 56 155 Q 110 140 160 148 T 250 130" fill="none" stroke="url(#nfAccent)" stroke-width="3" stroke-linecap="round"/>

  <!-- Floating Card 2: Interactive Chart -->
  <rect x="300" y="64" width="264" height="260" rx="12" fill="url(#nfCard)" stroke="rgba(255,255,255,0.08)"/>
  <text x="320" y="94" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">ANALYTICS PULSE</text>
  
  <!-- Mini Bar Chart -->
  <rect x="324" y="210" width="22" height="70" rx="4" fill="#334155"/>
  <rect x="356" y="170" width="22" height="110" rx="4" fill="url(#nfAccent)"/>
  <rect x="388" y="190" width="22" height="90" rx="4" fill="#334155"/>
  <rect x="420" y="140" width="22" height="140" rx="4" fill="url(#nfPurple)"/>
  <rect x="452" y="160" width="22" height="120" rx="4" fill="url(#nfAccent)"/>
  <rect x="484" y="120" width="22" height="160" rx="4" fill="#38bdf8"/>
  <rect x="516" y="180" width="22" height="100" rx="4" fill="#334155"/>

  <!-- Floating Card 3: Feature Callout -->
  <rect x="36" y="194" width="240" height="130" rx="12" fill="url(#nfCard)" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="68" cy="226" r="16" fill="url(#nfAccent)"/>
  <path d="M 62 226 L 66 230 L 75 221" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="96" y="224" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">NovaFlow SaaS</text>
  <text x="96" y="240" fill="#94a3b8" font-family="sans-serif" font-size="10">Ultra-fast CSS layout engine</text>
  <rect x="56" y="265" width="200" height="8" rx="4" fill="#334155"/>
  <rect x="56" y="282" width="140" height="8" rx="4" fill="#334155"/>
  <rect x="56" y="299" width="90" height="12" rx="6" fill="url(#nfAccent)"/>
</svg>

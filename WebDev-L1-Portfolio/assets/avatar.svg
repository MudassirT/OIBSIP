<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#4facfe" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Inner Circle Gradient -->
    <linearGradient id="innerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Filter for subtle drop shadow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="200" r="190" fill="url(#avatarGlow)" />

  <!-- Outer Neon Tech Ring -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="16 8" filter="url(#neonGlow)" />

  <!-- Inner Dark Surface -->
  <circle cx="200" cy="200" r="148" fill="url(#innerBg)" stroke="rgba(255,255,255,0.1)" stroke-width="2" />

  <!-- Subtle Circuit/Code Accents -->
  <path d="M 90 200 H 130 M 270 200 H 310 M 200 90 V 130 M 200 270 V 310" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.3" stroke-linecap="round"/>
  <circle cx="90" cy="200" r="3" fill="#00f2fe" fill-opacity="0.5"/>
  <circle cx="310" cy="200" r="3" fill="#8b5cf6" fill-opacity="0.5"/>

  <!-- Developer Silhouette / Initials Emblem -->
  <!-- Stylized Monogram "MA" -->
  <g transform="translate(200, 200)">
    <!-- Base decorative polygon -->
    <polygon points="0,-75 65,-38 65,38 0,75 -65,38 -65,-38" fill="rgba(30, 41, 59, 0.6)" stroke="url(#ringGrad)" stroke-width="2" />
    
    <!-- Stylized "MA" Typography -->
    <text x="0" y="24" 
          font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" 
          font-size="64" 
          font-weight="800" 
          letter-spacing="2"
          text-anchor="middle" 
          fill="url(#textGrad)">MA</text>
  </g>

  <!-- Developer Badge at Bottom -->
  <rect x="130" y="325" width="140" height="30" rx="15" fill="#0b0f19" stroke="url(#ringGrad)" stroke-width="1.5" />
  <circle cx="148" cy="340" r="4" fill="#10b981" />
  <text x="160" y="345" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">DEV • 19 Y/O</text>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a new SecureGate account. Enjoy end-to-end encrypted password storage and session protection.">
  <title>Register - SecureGate</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="page-wrapper">
    <!-- Brand Header -->
    <header class="brand-header">
      <a href="/login" class="brand-logo-link" aria-label="SecureGate Home">
        <div class="brand-icon-wrapper">
          <!-- Shield Key Lock Icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <circle cx="12" cy="11" r="2"/>
            <path d="M12 13v3"/>
          </svg>
        </div>
        <span class="brand-title">SecureGate</span>
      </a>
      <span class="brand-badge">Level 2 Task 4</span>
    </header>

    <!-- Main Registration Card -->
    <main class="auth-card" role="main">
      <div class="card-intro">
        <h1>Create an Account</h1>
        <p>Register below to setup your secure credentials</p>
      </div>

      <!-- Registration Alert / Duplicate Banner -->
      <div id="register-alert-banner" class="alert-banner" role="status" aria-live="polite">
        <!-- Alert Icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="register-alert-message"></span>
      </div>

      <!-- Registration Form -->
      <form id="register-form" class="auth-form" novalidate>
        <!-- Username Field -->
        <div class="form-group">
          <label for="reg-username" class="form-label">Username</label>
          <div class="input-wrapper">
            <svg class="input-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input 
              type="text" 
              id="reg-username" 
              name="username" 
              class="form-input" 
              placeholder="e.g. mudassir_dev" 
              autocomplete="username" 
              autocapitalize="none"
              spellcheck="false"
              enterkeyhint="next"
              required
            >
          </div>
          <span id="reg-username-error" class="field-error" role="alert"></span>
        </div>

        <!-- Email Field -->
        <div class="form-group">
          <label for="reg-email" class="form-label">Email Address</label>
          <div class="input-wrapper">
            <svg class="input-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <input 
              type="email" 
              id="reg-email" 
              name="email" 
              class="form-input" 
              placeholder="name@example.com" 
              autocomplete="email" 
              enterkeyhint="next"
              required
            >
          </div>
          <span id="reg-email-error" class="field-error" role="alert"></span>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="reg-password" class="form-label">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input 
              type="password" 
              id="reg-password" 
              name="password" 
              class="form-input" 
              placeholder="Create a strong password" 
              autocomplete="new-password" 
              enterkeyhint="next"
              required
            >
            <button 
              type="button" 
              class="password-toggle-btn" 
              data-target="reg-password" 
              aria-label="Show password" 
              aria-pressed="false"
            >
              <svg class="icon-eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="icon-eye-closed" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <span id="reg-password-error" class="field-error" role="alert"></span>

          <!-- Live Password Rules Checklist -->
          <div class="password-rules-card" aria-live="polite">
            <div class="rules-heading">Password Requirements</div>
            <ul class="rules-list">
              <li id="rule-length" class="rule-item">
                <span class="rule-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                  </svg>
                </span>
                <span>Minimum 8 characters</span>
              </li>
              <li id="rule-number" class="rule-item">
                <span class="rule-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                  </svg>
                </span>
                <span>At least 1 number (0-9)</span>
              </li>
            </ul>
          </div>
        </div>

        <!-- Confirm Password Field -->
        <div class="form-group">
          <label for="reg-confirm-password" class="form-label">Confirm Password</label>
          <div class="input-wrapper">
            <svg class="input-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            <input 
              type="password" 
              id="reg-confirm-password" 
              name="confirmPassword" 
              class="form-input" 
              placeholder="Re-enter password" 
              autocomplete="new-password" 
              enterkeyhint="done"
              required
            >
            <button 
              type="button" 
              class="password-toggle-btn" 
              data-target="reg-confirm-password" 
              aria-label="Show confirm password" 
              aria-pressed="false"
            >
              <svg class="icon-eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="icon-eye-closed" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <span id="reg-confirm-password-error" class="field-error" role="alert"></span>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="reg-submit-btn" class="btn-primary">
          <span class="btn-spinner" aria-hidden="true"></span>
          <span class="btn-text">Register Account</span>
        </button>
      </form>

      <!-- Footer Navigation Link -->
      <footer class="card-footer">
        <p>Already have an account? <a href="/login" class="link-styled">Log in here</a></p>
      </footer>
    </main>

    <!-- Page Footer -->
    <footer class="page-footer">
      <p>SecureGate Authentication System &bull; Oasis Infobyte Web Development</p>
    </footer>
  </div>

  <script src="/auth.js"></script>
</body>
</html>

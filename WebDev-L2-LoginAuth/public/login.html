<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SecureGate - A secure login and user authentication portal built with modern security standards.">
  <title>Login - SecureGate</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="page-wrapper">
    <!-- Brand Header -->
    <header class="brand-header">
      <a href="/login" class="brand-logo-link" aria-label="SecureGate Home">
        <div class="brand-icon-wrapper">
          <!-- Shield Key Lock Icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <circle cx="12" cy="11" r="2"/>
            <path d="M12 13v3"/>
          </svg>
        </div>
        <span class="brand-title">SecureGate</span>
      </a>
      <span class="brand-badge">Level 2 Task 4</span>
    </header>

    <!-- Main Auth Card -->
    <main class="auth-card" role="main">
      <div class="card-intro">
        <h1>Welcome Back</h1>
        <p>Please enter your credentials to access your dashboard</p>
      </div>

      <!-- Global Alert / Status Message Banner -->
      <div id="global-alert-banner" class="alert-banner" role="status" aria-live="polite">
        <!-- Alert Icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="global-alert-message"></span>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form" novalidate>
        <!-- Identifier (Username or Email) -->
        <div class="form-group">
          <label for="login-identifier" class="form-label">Username or Email</label>
          <div class="input-wrapper">
            <!-- User Icon -->
            <svg class="input-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input 
              type="text" 
              id="login-identifier" 
              name="identifier" 
              class="form-input" 
              placeholder="Username or email address" 
              autocomplete="username" 
              autocapitalize="none"
              spellcheck="false"
              enterkeyhint="next"
              required
            >
          </div>
          <span id="login-identifier-error" class="field-error" role="alert"></span>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="login-password" class="form-label">Password</label>
          <div class="input-wrapper">
            <!-- Lock Icon -->
            <svg class="input-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input 
              type="password" 
              id="login-password" 
              name="password" 
              class="form-input" 
              placeholder="Enter your password" 
              autocomplete="current-password" 
              enterkeyhint="done"
              required
            >
            <!-- Show/Hide Password Toggle -->
            <button 
              type="button" 
              class="password-toggle-btn" 
              data-target="login-password" 
              aria-label="Show password" 
              aria-pressed="false"
            >
              <!-- Eye Open Icon -->
              <svg class="icon-eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <!-- Eye Closed Icon -->
              <svg class="icon-eye-closed" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <span id="login-password-error" class="field-error" role="alert"></span>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="login-submit-btn" class="btn-primary">
          <span class="btn-spinner" aria-hidden="true"></span>
          <span class="btn-text">Log In</span>
        </button>
      </form>

      <!-- Footer Navigation Link -->
      <footer class="card-footer">
        <p>Don't have an account? <a href="/register" class="link-styled">Create an account</a></p>
      </footer>
    </main>

    <!-- Page Footer -->
    <footer class="page-footer">
      <p>SecureGate Authentication System &bull; Oasis Infobyte Web Development</p>
    </footer>
  </div>

  <script src="/auth.js"></script>
</body>
</html>
